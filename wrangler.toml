# wrangler.toml
name = 'help-lbdev-app--webhook-discord-forum'
main = "worker.js"
compatibility_date = "2026-08-18"

# Routes the contact form API. Requires the lbdev.app zone to be active on
# Cloudflare, and a DNS record for worker.lbdev.app (even a dummy, proxied
# one - Workers Routes need a matching hostname to attach to).
[[routes]]
pattern = "worker.lbdev.app/api/*"
zone_name = "lbdev.app"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Lets the Worker send emails - both the contact form's notify/auto-reply
# emails and the generic /api/send endpoint - via Cloudflare's native email
# sending, no third-party API key and no TCP Sockets needed (works on the
# free Workers plan). The destination address(es) used in worker.js
# (FORWARD_TO_EMAIL, and whatever /api/send is sent to) must be added and
# verified under Email Routing > Destination Addresses, UNLESS this binding
# is left unrestricted as below, in which case it can send to any address.
[[send_email]]
name = "SEND_EMAIL"


# The link between an email address (help@lbdev.app) and this Worker is made
# in the Cloudflare dashboard, not in this file:
#   Compute > Email Service > Email Routing > Routing Rules
#   -> Create routing rule -> Action: "Send to a Worker" -> pick this Worker.
#
# The fetch() contact form and send-email APIs are reachable at
# worker.lbdev.app/api/* (see the [[routes]] block above).
#
# Both webhook URLs, plus the send-email API key, are secrets, not
# variables - set them with:
#   wrangler secret put DISCORD_WEBHOOK_URL
#   wrangler secret put CONTACT_DISCORD_WEBHOOK_URL
#   wrangler secret put SEND_EMAIL_API_KEY         (a random string, e.g. `openssl rand -hex 32` -
#                                                    callers of POST /api/send must send this as
#                                                    `Authorization: Bearer <key>`. Backend-to-backend
#                                                    only - never embed it in browser/client code.)
#
# NOTE ON THE DOMAIN MOVE: renaming `name` above means Cloudflare treats
# this as a brand new Worker, not a rename of the old lbdev.tech one. After
# deploying, re-add the secrets and the send_email destination on this
# Worker (they don't carry over), point the Email Routing rule at it, and
# delete the old help-lbdev-tech--webhook-discord-forum Worker once
# everything's confirmed working on lbdev.app.
